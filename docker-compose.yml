services:
  postgres:
    image: postgres:18-alpine
    container_name: ticketnepal-postgres
    environment:
      POSTGRES_DB: ticketnepal
      POSTGRES_USER: ticketnepal
      POSTGRES_PASSWORD: ticketnepal_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketnepal -d ticketnepal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: